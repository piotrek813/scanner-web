<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Barcode Camera</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			text-align: center;
			margin-top: 40px;
			background: #f5f5f5;
		}

		input {
			font-size: 28px;
			width: 400px;
			padding: 10px;
		}

		video {
			margin-top: 20px;
			width: 320px;
			height: 240px;
			border: 2px solid #444;
		}

		#status {
			margin-top: 20px;
			font-size: 20px;
			color: green;
		}
	</style>
</head>

<body>

	<h2>Scan Barcode</h2>

	<input id="barcode" autofocus autocomplete="off">

	<br>

	<video id="video" autoplay playsinline></video>

	<canvas id="canvas" style="display:none;"></canvas>

	<div id="status">Waiting for scan...</div>

	<script>
		const input = document.getElementById("barcode");
		const video = document.getElementById("video");
		const canvas = document.getElementById("canvas");
		const status = document.getElementById("status");

		let stream;

		async function startCamera() {

			if (stream) {
				stream.getTracks().forEach(t => t.stop());
			}

			stream = await navigator.mediaDevices.getUserMedia({
				video: {
					facingMode: "user"
				},
				audio: false
			});

			video.srcObject = stream;

			return new Promise(resolve => {
				video.onloadedmetadata = () => {
					resolve();
				};
			});
		}

		async function capture(barcode) {

			status.innerHTML = "Opening camera...";

			await startCamera();

			await new Promise(r => setTimeout(r, 700));

			canvas.width = video.videoWidth;
			canvas.height = video.videoHeight;

			const ctx = canvas.getContext("2d");
			ctx.drawImage(video, 0, 0);

			const link = document.createElement("a");
			link.download = barcode + ".jpg";
			link.href = canvas.toDataURL("image/jpeg", 0.95);
			link.click();

			stream.getTracks().forEach(t => t.stop());

			status.innerHTML = "Saved " + barcode + ".jpg";

			input.value = "";
			input.focus();
		}

		input.addEventListener("keydown", function (e) {

			if (e.key === "Tab") {

				e.preventDefault();

				const barcode = input.value.trim();

				if (barcode.length === 0) return;

				capture(barcode);
			}

		});
	</script>

</body>

</html>
